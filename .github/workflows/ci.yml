name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Typecheck, Tokens, Build & Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Token validation
        run: npm run tokens:validate -- --strict

      - name: Build
        run: npm run build

      # No lint or unit-test step: this repo has neither configured. `npm run
      # verify` is typecheck + token validation + smoke, and the smoke suite is
      # a real end-to-end walk of the OIDC flow, not a placeholder.
      - name: Smoke test
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          # Poll rather than sleep a fixed interval, so a slow boot does not
          # fail the run and a hung boot is caught by the timeout below.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health/liveness > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then echo "server never became live"; exit 1; fi
            sleep 1
          done
          npm run smoke
          # The rate limiter is per-instance and its 15-minute window is not
          # reset by restarts within a window, so the suite is only valid
          # against a freshly started server. This is why the server is started
          # here rather than reused.

  docker:
    name: Build & Push Docker
    needs: verify
    # Was `main` only, which meant `deploy-staging` (on develop) could never
    # run: its `needs: docker` dependency was always skipped. Build on both
    # release branches; the tags keep them distinguishable.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploys are opt-in and fail loudly.
  #
  # These were `echo` placeholders that reported success without deploying
  # anything. They now do a real `kubectl apply` + rollout wait, but only run
  # when the `DEPLOY_STAGING_ENABLED` / `DEPLOY_PROD_ENABLED` repository
  # variables are set to 'true' AND a KUBE_CONFIG_B64 secret is present.
  # Otherwise the job is skipped with a visible reason instead of passing
  # quietly — a deploy pipeline that is green because it did nothing is worse
  # than no pipeline at all.
  #
  # To enable staging:
  #   1. gh variable set DEPLOY_STAGING_ENABLED true
  #   2. base64 -w0 ~/.kube/staging.config | gh secret set KUBE_CONFIG_B64
  #   3. Set the kube-context in the variable DEPLOY_STAGING_CONTEXT.
  # ---------------------------------------------------------------------------

  deploy-staging:
    name: Deploy to Staging
    needs: docker
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.DEPLOY_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    # Never let two deploys race; queue instead.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Check configuration
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_CONTEXT: ${{ vars.DEPLOY_STAGING_CONTEXT }}
        run: |
          # `secrets.*` cannot be referenced in a step-level `if`, so the
          # presence check has to happen here rather than as a step condition.
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::DEPLOY_STAGING_ENABLED is true but the KUBE_CONFIG_B64 secret is not set."
            exit 1
          fi
          if [ -z "$KUBE_CONTEXT" ]; then
            echo "::error::vars.DEPLOY_STAGING_CONTEXT is not set."
            exit 1
          fi

      - name: Write kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      - name: Deploy
        env:
          KUBE_CONTEXT: ${{ vars.DEPLOY_STAGING_CONTEXT }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl config use-context "$KUBE_CONTEXT"
          # The Secret is intentionally NOT applied from this repo: generate it
          # with `node scripts/gen-k8s-secret.mjs --apply` so the values never
          # pass through git.
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n lgu-portal rollout status deployment/lgu-portal --timeout=180s

  deploy-production:
    name: Deploy to Production
    needs: docker
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check configuration
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_CONTEXT: ${{ vars.DEPLOY_PROD_CONTEXT }}
        run: |
          # `secrets.*` cannot be referenced in a step-level `if`, so the
          # presence check has to happen here rather than as a step condition.
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::DEPLOY_PROD_ENABLED is true but the KUBE_CONFIG_B64 secret is not set."
            exit 1
          fi
          if [ -z "$KUBE_CONTEXT" ]; then
            echo "::error::vars.DEPLOY_PROD_CONTEXT is not set."
            exit 1
          fi

      - name: Write kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      - name: Deploy
        env:
          KUBE_CONTEXT: ${{ vars.DEPLOY_PROD_CONTEXT }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl config use-context "$KUBE_CONTEXT"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          # Production holds real sessions: wait for every replica to pass its
          # readiness probe before declaring the rollout done.
          kubectl -n lgu-portal rollout status deployment/lgu-portal --timeout=300s
          kubectl -n lgu-portal get pods -l app=lgu-portal

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to a release, not @master: a mutable ref in a security scanner
      # means the scanner itself can be changed by anyone who can push to it.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: lgu-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: lgu-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # volatile-ttl, deliberately not allkeys-lru. This instance holds
          # live sessions, and allkeys-lru evicts by recency of *use* — under
          # memory pressure it would sign out whoever happened to be active,
          # while volatile-ttl evicts the sessions closest to expiring, which is
          # the set least likely to be missed. Every key here carries a TTL, so
          # volatile-ttl always has candidates.
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - volatile-ttl
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lgu-portal
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis

# TEMPLATE — not directly applicable.
#
# This file is a reference for which keys the deployment needs. It is named
# `.example.yaml` and deliberately contains no real values, because a Secret
# manifest carrying placeholder strings is one `kubectl apply` away from being
# a real incident: the app boots, SESSION_SECRET is a well-known literal, and
# every session cookie in the country is forgeable.
#
# Generate the real thing instead:
#
#   node scripts/gen-k8s-secret.mjs                 # print manifest to stdout
#   node scripts/gen-k8s-secret.mjs --apply         # pipe straight to kubectl
#   node scripts/gen-k8s-secret.mjs --env-file .env.production
#
# Each run produces fresh 48-byte random secrets. The output is written to
# stdout only — never to a file in the repo, and never to shell history.
#
# If your cluster has External Secrets Operator or SOPS, prefer wiring the
# generator's output into that instead; this repo has no opinion on your KMS.
apiVersion: v1
kind: Secret
metadata:
  name: lgu-portal-secrets
  namespace: lgu-portal
type: Opaque
stringData:
  # openssl rand -base64 48 — must be at least 32 characters or the app refuses
  # to start in production.
  SESSION_SECRET: "GENERATE_ME"
  # Falls back to SESSION_SECRET if unset; generate separately anyway so the
  # OIDC signing key can be rotated without invalidating sessions.
  OIDC_SIGNING_SECRET: "GENERATE_ME"
  # Must match the ingress host exactly. Single-origin by design.
  OIDC_ISSUER: "https://portal.lgu.gov.ph"
  # Demo credential for the seeded users. Remove before any real deployment.
  DEMO_PASSWORD: "Lgu@Portal2026"
  # External IdP client secret (optional, omit for public clients).
  # IDP_CLIENT_SECRET: "GENERATE_ME"

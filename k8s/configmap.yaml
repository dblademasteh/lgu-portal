apiVersion: v1
kind: ConfigMap
metadata:
  name: lgu-portal-config
  namespace: lgu-portal
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  REDIS_URL: "redis://redis:6379"
  LOG_LEVEL: "info"
  # OIDC_ISSUER: "https://portal.lgu.gov.ph"
  # Uncomment and fill in when wiring an external IdP:
  # IDP_ISSUER: "https://keycloak.lgu.gov.ph"
  # IDP_CLIENT_ID: "portal-client"
  # IDP_CLIENT_SECRET: "<from secret>"
  # IDP_SCOPES: "openid profile email"
  # LOCAL_LOGIN_ENABLED: "false"
